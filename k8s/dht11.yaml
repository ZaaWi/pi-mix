apiVersion: apps/v1
kind: Deployment
metadata:
  name: dht11
  namespace: iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dht11
  template:
    metadata:
      labels:
        app: dht11
    spec:
      containers:
        - name: dht11
          image: mhmdzawi/pi-mix-dht11:e1f9ba16c7bfed381fe916f5239c62768c32d9f8
          imagePullPolicy: Always
          env:
            - name: BRIDGE_HOST
              value: serial-bridge
            - name: MQTT_BROKER
              value: mosquitto
