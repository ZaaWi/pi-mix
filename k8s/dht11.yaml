apiVersion: apps/v1
kind: Deployment
metadata:
  name: dht11
  namespace: iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dht11
  template:
    metadata:
      labels:
        app: dht11
    spec:
      containers:
        - name: dht11
          image: mhmdzawi/pi-mix-dht11:fc19e55
          imagePullPolicy: IfNotPresent
          env:
            - name: BRIDGE_HOST
              value: serial-bridge
            - name: MQTT_BROKER
              value: mosquitto
      nodeSelector:
        kubernetes.io/hostname: the-bear
