apiVersion: apps/v1
kind: Deployment
metadata:
  name: ir
  namespace: iot
  labels:
    app: ir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ir
  template:
    metadata:
      labels:
        app: ir
    spec:
      containers:
      - name: ir
        image: mhmdzawi/pi-mix-ir:909edd9eaf886ecceab90c1a9d1329d1d13a7d05
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: IR_GPIO_CHIP
          value: gpiochip0
        - name: IR_GPIO_OFFSET
          value: '17'
        - name: MQTT_BROKER
          value: tcp://mosquitto.iot.svc.cluster.local:1883
        - name: MQTT_TOPIC
          value: pi/ir
        - name: BRIDGE_HOST
          value: serial-bridge
        - name: BRIDGE_PORT
          value: '9600'
        - name: IR_ACTION_FILE
          value: /etc/ir-actions.json
        - name: MQTT_USERNAME
          valueFrom:
            secretKeyRef:
              name: pi-mix-mqtt
              key: username
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pi-mix-mqtt
              key: password
        - name: BRIDGE_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              name: bridge-control
              key: token
        volumeMounts:
        - name: actions
          mountPath: /etc/ir-actions.json
          subPath: ir-actions.json
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
      volumes:
      - name: actions
        configMap:
          name: ir-actions
          optional: true
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: the-bear
  strategy:
    type: Recreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ir-actions
  namespace: iot
data:
  ir-actions.json: "{\n  \"codes\": {}\n}\n"
