apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: iot
  labels:
    app: victoriametrics
    hdd-snitch.storage/lab: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
        hdd-snitch.storage/lab: "true"
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.101.0
          args:
            - "-storageDataPath=/storage"
            - "-retentionPeriod=1y"
          ports:
            - containerPort: 8428
              name: http
          volumeMounts:
            - name: storage
              mountPath: /storage
      volumes:
        - name: storage
          hostPath:
            path: /mnt/lab/victoriametrics-data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: iot
spec:
  selector:
    app: victoriametrics
  ports:
    - protocol: TCP
      port: 8428
      targetPort: http
