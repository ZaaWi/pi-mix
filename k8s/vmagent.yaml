apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: iot
  labels:
    app: vmagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmagent
  template:
    metadata:
      labels:
        app: vmagent
    spec:
      containers:
      - name: vmagent
        image: victoriametrics/vmagent:v1.101.0
        args:
        - -remoteWrite.url=http://victoriametrics.iot.svc.cluster.local:8428/api/v1/write
        - -remoteWrite.tmpDataPath=/buffer
        - -remoteWrite.maxDiskUsagePerURL=1GB
        ports:
        - containerPort: 8429
          name: http
        volumeMounts:
        - name: buffer
          mountPath: /buffer
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        env: []
        readinessProbe:
          httpGet:
            path: /health
            port: 8429
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8429
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
      volumes:
      - name: buffer
        persistentVolumeClaim:
          claimName: vmagent-buffer
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: vaio-server
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: vmagent
  namespace: iot
spec:
  selector:
    app: vmagent
  ports:
  - protocol: TCP
    port: 8429
    targetPort: http
