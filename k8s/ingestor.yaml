apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
  namespace: iot
  labels:
    app: ingestor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestor
  template:
    metadata:
      labels:
        app: ingestor
    spec:
      containers:
        - name: ingestor
          image: mhmdzawi/pi-mix-ingestor:12d895a96cac218ddc26a72846b52b7cba146422
          imagePullPolicy: IfNotPresent
          env:
            - name: MQTT_BROKER
              value: "tcp://mosquitto.iot.svc.cluster.local:1883"
            - name: VMAGENT_URL
              value: "http://vmagent.iot.svc.cluster.local:8429/api/v1/import/prometheus"
