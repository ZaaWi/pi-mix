apiVersion: apps/v1
kind: Deployment
metadata:
  name: serial-bridge
  namespace: iot
  labels:
    app: serial-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serial-bridge
  template:
    metadata:
      labels:
        app: serial-bridge
    spec:
      containers:
      - name: bridge
        image: mhmdzawi/pi-mix-serial-bridge:4b41fe122c7eb3717f705bb8855edd66a6ecf4ec
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: BRIDGE_SERIAL_PORT
          value: /dev/ttyAMA0
        - name: BRIDGE_PORT
          value: '9600'
        - name: BRIDGE_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              name: bridge-control
              key: token
        - name: BRIDGE_BAUD
          value: '9600'
        ports:
        - containerPort: 9600
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        readinessProbe:
          exec:
            command:
            - /bridge
            - -check
          timeoutSeconds: 7
          periodSeconds: 15
          failureThreshold: 3
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: the-bear
  strategy:
    type: Recreate
