apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-ingestor
  namespace: database
  labels:
    app: db-ingestor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-ingestor
  template:
    metadata:
      labels:
        app: db-ingestor
    spec:
      nodeSelector:
        kubernetes.io/hostname: vaio-server
      volumes:
      - name: spill-data
        persistentVolumeClaim:
          claimName: db-ingestor-spill-vaio
      containers:
      - name: db-ingestor
        image: mhmdzawi/pi-mix-db-ingestor:010322fc7f1091c94c5f6fa3ef21df2d7181da98
        imagePullPolicy: IfNotPresent
        env:
        - name: MQTT_BROKER
          value: tcp://mosquitto.iot.svc.cluster.local:1883
        - name: MQTT_TOPIC
          value: pi/dht11,pi/ldr,pi/scale
        - name: SPILL_DIR
          value: /var/lib/db-ingestor/spill
        - name: PG_HOST
          value: postgres.database.svc.cluster.local
        - name: PG_PORT
          value: '5432'
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: pi-mix-pg
              key: POSTGRES_USER
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pi-mix-pg
              key: POSTGRES_PASSWORD
        - name: PG_DB
          valueFrom:
            secretKeyRef:
              name: pi-mix-pg
              key: POSTGRES_DB
        - name: MQTT_USERNAME
          valueFrom:
            secretKeyRef:
              name: pi-mix-mqtt
              key: username
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pi-mix-mqtt
              key: password
        volumeMounts:
        - name: spill-data
          mountPath: /var/lib/db-ingestor
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 8090
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8090
          timeoutSeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8090
          timeoutSeconds: 3
          periodSeconds: 20
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
  strategy:
    type: Recreate
