apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-schema
  namespace: database
  labels:
    app: postgres
data:
  schema.sql: |-
    -- Rolled-up sensor data: 15-min and 1-hour buckets per sensor+metric.
    -- Written by db-ingestor; flush is idempotent via the UNIQUE upsert key.
    CREATE TABLE IF NOT EXISTS pi_sensor_data (
      id          BIGSERIAL PRIMARY KEY,
      sensor      TEXT NOT NULL,                 -- e.g. 'dht11', 'ldr'
      metric      TEXT NOT NULL,                 -- e.g. 'temp_c', 'humidity_pct', 'analog'
      interval    TEXT NOT NULL CHECK (interval IN ('15m', '1h')),
      ts          TIMESTAMPTZ NOT NULL,          -- bucket start (Pi source clock)
      count       INTEGER NOT NULL,              -- raw samples rolled in
      avg         DOUBLE PRECISION NOT NULL,
      min         DOUBLE PRECISION NOT NULL,
      max         DOUBLE PRECISION NOT NULL,
      last        DOUBLE PRECISION NOT NULL,
      inserted_at TIMESTAMPTZ NOT NULL DEFAULT now(),  
      UNIQUE (sensor, metric, interval, ts)
    );

    CREATE INDEX IF NOT EXISTS idx_pi_sensor_data_ts
      ON pi_sensor_data (ts);

    CREATE INDEX IF NOT EXISTS idx_pi_sensor_data_lookup
      ON pi_sensor_data (sensor, metric, interval, ts DESC);
