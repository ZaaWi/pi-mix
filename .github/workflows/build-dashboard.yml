name: Build Web Dashboard

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/build-dashboard.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pi-mix-dashboard:latest
            ${{ secrets.DOCKER_USERNAME }}/pi-mix-dashboard:${{ github.sha }}

      - name: Update k8s manifest
        run: |
          sed -i 's|image: mhmdzawi/pi-mix-dashboard:.*|image: mhmdzawi/pi-mix-dashboard:'"${GITHUB_SHA}"'|' k8s/dashboard.yaml

      - name: Commit and push
        run: |
          git config user.name "pi-mix CI"
          git config user.email "ci@pi-mix"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add k8s/dashboard.yaml
          git diff --cached --quiet || git commit -m "update dashboard image to ${GITHUB_SHA}"
          git pull --rebase
          git push
