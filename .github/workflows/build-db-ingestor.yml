name: Build db-ingestor

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - agents/db-ingestor/**
      - .github/workflows/build-db-ingestor.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: agents/db-ingestor
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pi-mix-db-ingestor:${{ github.sha }}

      - name: Update k8s manifest
        run: |
          if [ -f k8s/database/db-ingestor.yaml ]; then
            sed -i 's|image: mhmdzawi/pi-mix-db-ingestor:.*|image: mhmdzawi/pi-mix-db-ingestor:'"${GITHUB_SHA}"'|' k8s/database/db-ingestor.yaml
            git config user.name "pi-mix CI"
            git config user.email "ci@pi-mix"
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            git add k8s/database/db-ingestor.yaml
            git diff --cached --quiet || git commit -m "update db-ingestor image to ${GITHUB_SHA}"
            git pull --rebase
            git push
          fi