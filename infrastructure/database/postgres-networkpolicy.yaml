apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-access
  namespace: database
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: database
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: iot
    - namespaceSelector:
        matchLabels:
          homelab/database-access: 'true'
    ports:
    - protocol: TCP
      port: 5432
