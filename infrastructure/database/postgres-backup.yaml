apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-backups-the-bear
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: postgres-backup-manual
  hostPath:
    path: /var/backups/postgresql/daily
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [the-bear]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: database
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: postgres-backup-manual
  volumeName: postgres-backups-the-bear
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: database
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  schedule: "15 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: the-bear
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  partial="/backups/cluster-${stamp}.sql.partial"
                  final="/backups/cluster-${stamp}.sql.gz"
                  pg_dumpall --no-role-passwords > "${partial}"
                  gzip "${partial}"
                  gzip -t "${partial}.gz"
                  mv "${partial}.gz" "${final}"
                  find /backups -type f -name 'cluster-*.sql.gz' -mtime +14 -delete
              env:
                - name: PGHOST
                  value: postgres.database.svc.cluster.local
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: pg-credentials
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pg-credentials
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
            - name: tmp
              emptyDir: {}
