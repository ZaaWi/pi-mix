apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: database
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: database
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  schedule: 15 3 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: vaio-server
          automountServiceAccountToken: false
          containers:
          - name: backup
            image: postgres:16
            command:
            - sh
            - -c
            - 'set -eu

              umask 077

              stamp=$(date -u +%Y%m%dT%H%M%SZ)

              pg_dumpall --no-role-passwords > /backups/$stamp.sql.partial

              gzip /backups/$stamp.sql.partial

              mv /backups/$stamp.sql.partial.gz /backups/$stamp.sql.gz

              find /backups -name "*.sql.gz" -mtime +14 -delete

              '
            env:
            - name: PGHOST
              value: postgres.database.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: POSTGRES_PASSWORD
            volumeMounts:
            - name: backups
              mountPath: /backups
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: postgres-backups
