apiVersion: batch/v1
kind: Job
metadata:
  name: firmware-flasher
  namespace: iot
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: flasher
        image: mhmdzawi/pi-mix-firmware:f53a16f6d75c2fbe32f892e6853490fb6d009e0c
        env:
        - name: BRIDGE_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              name: bridge-control
              key: token
      nodeSelector:
        kubernetes.io/hostname: the-bear
      automountServiceAccountToken: false
    metadata:
      labels:
        app: firmware-flasher
  backoffLimit: 1
