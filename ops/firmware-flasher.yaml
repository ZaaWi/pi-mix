apiVersion: batch/v1
kind: Job
metadata:
  name: firmware-flasher
  namespace: iot
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: flasher
        image: mhmdzawi/pi-mix-firmware:2bbfb424bc1cea18bdf8cfbb8174ef23a17d20b5
        env:
        - name: BRIDGE_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              name: bridge-control
              key: token
      nodeSelector:
        kubernetes.io/hostname: the-bear
      automountServiceAccountToken: false
    metadata:
      labels:
        app: firmware-flasher
  backoffLimit: 1
