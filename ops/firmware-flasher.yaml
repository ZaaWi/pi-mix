apiVersion: batch/v1
kind: Job
metadata:
  name: firmware-flasher
  namespace: iot
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: flasher
        image: mhmdzawi/pi-mix-firmware:3a5936868e2fee68811a3f6ed9a43e2d1b2388d1
        env:
        - name: BRIDGE_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              name: bridge-control
              key: token
      nodeSelector:
        kubernetes.io/hostname: the-bear
      automountServiceAccountToken: false
    metadata:
      labels:
        app: firmware-flasher
  backoffLimit: 1
